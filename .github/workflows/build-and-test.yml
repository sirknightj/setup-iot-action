name: Build and Commit dist/ Files

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  node_version: 20

jobs:
  build:
    name: Build dist files
    runs-on: ubuntu-latest

    if: ${{ github.actor != 'github-actions' }}

    outputs:
      artifact-name: dist-artifact

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}

      - name: Install dependencies
        run: |
          sudo npm i -g @vercel/ncc
          npm i

      - name: Delete existing dist
        run: rm -rf dist

      - name: Build dist files
        run: npm run build

      - name: Upload dist/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: dist/

  test:
    name: Run test
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}

      - name: Download dist/ artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: dist/

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: 'us-west-2'

      - name: Run action
        uses: ./
        with:
          thing-name: "my-test-thing"
          iam-role-name: 'my-test-role'
          iam-policy-name: 'my-test-policy'
          iam-policy-string: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "kinesisvideo:CreateSignalingChannel",
                    "kinesisvideo:DescribeSignalingChannel",
                    "kinesisvideo:GetSignalingChannelEndpoint",
                    "kinesisvideo:ConnectAsMaster",
                    "kinesisvideo:GetIceServerConfig"
                  ],
                  "Resource": "arn:aws:kinesisvideo:*:*:channel/${credentials-iot:ThingName}/*"
                }
              ]
            }

          iot-role-alias: 'my-test-role-alias'
  commit:
    name: Commit and push dist/
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Download dist/ artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: dist/

      - name: Commit and push changes
        run: |
          git add dist/
          if ! git commit -m "Update dist files"; then
            echo "No changes to commit"
            exit 0
          fi
          git pull --rebase origin ${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
